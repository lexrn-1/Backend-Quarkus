name: Backend sprints 0 y 1
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar imágenes en GHCR
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/integration/package-lock.json
      - run: ./mvnw -B -ntp clean verify
      - run: npm ci --no-audit --no-fund
        working-directory: tests/integration
      - run: npm run verify
        working-directory: tests/integration
      - run: docker compose --profile emulators config --quiet
      - run: docker compose --profile emulators up --build --wait --wait-timeout 240
      - name: Smoke de contenedores
        shell: bash
        run: |
          curl --fail http://127.0.0.1:8080/q/health/ready
          curl --fail http://127.0.0.1:8081/q/health/ready
          curl --fail http://127.0.0.1:8080/q/openapi
          curl --fail http://127.0.0.1:8081/q/swagger-ui/
      - name: Cerrar contenedores
        if: always()
        run: docker compose --profile emulators down
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics
          path: |
            **/target/surefire-reports/
            **/target/integration-*.log
  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend-api, backend-realtime]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Nombre de imagen
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
